{% extends "users/base.html" %}
{% block title %}Change password | Crop Yield Prediction{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-soft p-4">
      <h3 class="mb-3">Change password</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
          <div class="mb-3"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
        {% endfor %}
        <button type="submit" class="btn btn-green w-100">Update password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
