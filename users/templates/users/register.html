{% extends "users/base.html" %}
{% block title %}Register | Crop Yield Prediction{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-soft p-4">
      <h3 class="mb-3">Create an account</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
          <div class="mb-3">{{ field }}{{ field.errors }}</div>
        {% endfor %}
        <button type="submit" class="btn btn-green w-100">Register</button>
      </form>
      <p class="mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
